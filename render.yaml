services:
  - type: web
    name: arlis-back
    runtime: python
    plan: free
    branch: demo
    buildCommand: pip install -r requirements-render.txt
    startCommand: python -m backend.main --index data/structured/render_index --lexical-only
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: FRONTEND_ORIGINS
        value: https://arlis-ai.am
      - key: API_KEY
        sync: false
